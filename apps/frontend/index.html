<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-init.js"></script>

    <!-- Primary SEO -->
    <title>SafeApply.AI — Research Companies Before You Apply</title>
    <meta
      name="description"
      content="Cited company intelligence for job seekers: news, GitHub activity, ghost-job detection, anonymous reviews, CV matching, and application tracking. Evidence, not opinions."
    />
    <link rel="canonical" href="https://safeapply.ai/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="SafeApply.AI" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SafeApply.AI — Research Companies Before You Apply" />

      property="og:description"
      content="Cited company intelligence for job seekers: news, GitHub activity, ghost-job detection, anonymous reviews, CV matching, and application tracking."

    <meta name="twitter:description" content="Cited company intelligence for job seekers. Evidence, not opinions." />
    <meta name="twitter:image" content="https://safeapply.ai/og-image.png" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Fonts and icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

          {
            "@type": "Organization",
            "name": "SafeApply.AI",

          }
